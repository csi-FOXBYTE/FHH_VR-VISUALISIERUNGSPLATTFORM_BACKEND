name: Build & deploy backend

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-fhhvr-backend
  cancel-in-progress: false

env:
  APP: fhhvr-webbackend
  RG: FHH-VR-VISUALISIERUNGSPLATTFORM
  IMAGE: docker.io/foxbytecsi/fhhvr-webbackend

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=${VERSION}-build.$(printf '%05d' ${{ github.run_number }})" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image
        run: |
          set -euo pipefail
          az containerapp update -n "$APP" -g "$RG" \
            --image "${IMAGE}:${{ steps.meta.outputs.tag }}"

      - name: Wait for revision to become healthy
        run: |
          set -euo pipefail
          REV=$(az containerapp show -n "$APP" -g "$RG" \
            --query "properties.latestRevisionName" -o tsv)
          echo "Waiting for $REV"
          for i in $(seq 1 40); do
            STATE=$(az containerapp revision show -n "$APP" -g "$RG" \
              --revision "$REV" --query "properties.runningState" -o tsv)
            echo "  $STATE"
            case "$STATE" in
              Running|RunningAtMaxScale) echo "OK"; exit 0 ;;
              Failed|Degraded) echo "::error::Revision $REV is $STATE"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for $REV"
          exit 1

      - name: Show revision on failure
        if: failure()
        run: |
          az containerapp revision list -n "$APP" -g "$RG" -o table \
            --query "[].{rev:name,state:properties.runningState,traffic:properties.trafficWeight,image:properties.template.containers[0].image}" || true
          az containerapp logs show -n "$APP" -g "$RG" --type system --tail 50 || true
